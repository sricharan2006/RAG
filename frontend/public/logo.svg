<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect width="48" height="48" rx="12" fill="#ffffff" />
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Open Research Paper / Book Pages -->
  <!-- Left Page -->
  <path d="M12 33.5C16 32 20.5 32.5 24 35V16C20.5 13.5 16 13 12 14.5V33.5Z" 
        fill="#f1f5f9" 
        stroke="#4f46e5" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Right Page -->
  <path d="M36 33.5C32 32 27.5 32.5 24 35V16C27.5 13.5 32 13 36 14.5V33.5Z" 
        fill="#f8fafc" 
        stroke="#4f46e5" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Page Spine Divider -->
  <line x1="24" y1="16" x2="24" y2="35" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" />

  <!-- Subtle Document Text Lines -->
  <line x1="16" y1="19" x2="20" y2="19" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="15" y1="23" x2="21" y2="23" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="15" y1="27" x2="19" y2="27" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

  <line x1="28" y1="19" x2="32" y2="19" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="27" y1="23" x2="33" y2="23" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="29" y1="27" x2="33" y2="27" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Central AI Neural Intelligence Core -->
  <circle cx="24" cy="11.5" r="3.5" fill="url(#aiGrad)" />
  <circle cx="24" cy="11.5" r="1.5" fill="#ffffff" />

  <!-- Neural Sparks / Rays connecting intelligence to research -->
  <path d="M21 11.5L18.5 10.5M27 11.5L29.5 10.5M24 7.5V6" 
        stroke="#6366f1" 
        stroke-width="1.5" 
        stroke-linecap="round" />

  <!-- Neural Connection to the Pages -->
  <path d="M22 13.5L19 16.5M26 13.5L29 16.5" 
        stroke="url(#aiGrad)" 
        stroke-width="1.5" 
        stroke-linecap="round" />
</svg>
